<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 홈트레이닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1c1b19; --muted:#6f6a60; --line:#e4ded1;
  --accent:#ff5a1f; --accent-soft:#ffe6da; --ok:#2a9a62; --ok-soft:#dcf2e6;
  --cardio:#2f6fdc; --cardio-soft:#e0eafc; --rest:#8a8378; --rest-soft:#ece8df;
  --warn:#b4451f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 140px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 14px}
.brand{font-family:"Black Han Sans",sans-serif;font-size:30px;line-height:1;letter-spacing:.5px}
.brand span{color:var(--accent)}
button.brand{padding:0;text-align:left}
.homebtn{width:46px;height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:20px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.homebtn small{font-size:10px;color:var(--muted);margin-top:2px}
.date{font-size:13px;color:var(--muted);text-align:right;line-height:1.4}
.date b{color:var(--ink)}
.weekbar{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.weekbar .wk{font-family:"Black Han Sans";font-size:26px;color:var(--accent);white-space:nowrap}
.weekbar .focus{font-size:14px;line-height:1.45}
.weekbar .focus small{display:block;color:#bdb6aa;font-size:12px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--rest-soft);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5}
nav.tabs a{text-align:center;padding:10px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none}
nav.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{padding:8px 0 7px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:15px;position:relative}
.day small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}
.day.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.day.sel small{color:#cfc8bb}
.day.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.done.sel{background:var(--ok);border-color:var(--ok)}
.hero{border-radius:18px;padding:18px;margin-bottom:12px;background:var(--accent-soft)}
.hero.cardio{background:var(--cardio-soft)}
.hero.rest{background:var(--rest-soft)}
.hero .kind{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.hero.cardio .kind{color:var(--cardio)} .hero.rest .kind{color:var(--rest)}
.hero h2{font-family:"Black Han Sans";font-weight:400;font-size:32px;margin:4px 0 6px}
.hero .meta{font-size:14px;color:var(--muted)}
.prog{height:8px;background:rgba(0,0,0,.08);border-radius:8px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.hero.cardio .prog i{background:var(--cardio)}
.prog-lbl{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.restpick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px}
.card.complete{border-color:var(--ok);background:#f7fcf9}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:900}
.card .rx{font-size:14px;color:var(--accent);font-weight:700;margin-top:2px}
.card.cardio-item .rx{color:var(--cardio)}
.num{font-family:"Black Han Sans";font-size:15px;color:var(--muted);min-width:22px}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.set{width:52px;height:52px;border-radius:14px;border:2px dashed #cfc7b8;font-weight:900;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.set small{font-size:10px;font-weight:500}
.set.on{border:2px solid var(--ok);background:var(--ok);color:#fff}
.set.on small{color:#e6fff1}
.btn{padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--cardio)}
.btn.sm{padding:8px 11px;font-size:13px}
details{margin-top:10px;font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ "} details[open] summary::before{content:"－ "}
details ul{margin:8px 0 0;padding-left:18px;line-height:1.6}
details .tip{margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:13px;color:var(--muted)}
.safety{display:flex;gap:10px;align-items:flex-start;background:#fff3ee;border:1.5px solid #ffc9b3;color:var(--warn);padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;margin:14px 0}
.cond{margin-top:14px}
.cond .row{display:flex;gap:6px;margin-top:8px}
.cond .row .chip{flex:1;text-align:center;padding:10px 4px}
.done-banner{background:var(--ok);color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:700;margin:12px 0}
.done-banner b{font-family:"Black Han Sans";font-weight:400;font-size:22px;display:block}
h4.sec{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
table.wk{width:100%;border-collapse:separate;border-spacing:0 6px}
table.wk td{background:var(--card);padding:12px 10px;font-size:14px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
table.wk td:first-child{border-left:1.5px solid var(--line);border-radius:12px 0 0 12px;font-weight:900;width:44px;text-align:center}
table.wk td:last-child{border-right:1.5px solid var(--line);border-radius:0 12px 12px 0;text-align:right;white-space:nowrap}
table.wk tr.today td{border-color:var(--ink)}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.part{background:var(--accent-soft);color:var(--accent)}
.tag.miss{background:var(--rest-soft);color:var(--muted)}
.tag.plan{background:transparent;color:var(--muted);border:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{font-family:"Black Han Sans";font-weight:400;font-size:26px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.grid28{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:center}
.grid28 .h{font-size:11px;color:var(--muted);text-align:center}
.grid28 .wl{font-size:11px;font-weight:700;color:var(--muted);padding-right:4px}
.cell{aspect-ratio:1;border-radius:8px;background:var(--rest-soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cell.ok{background:var(--ok);color:#fff}
.cell.part{background:#ffc4ab;color:#7a2a0c}
.cell.fut{background:transparent;border:1.5px dashed var(--line)}
.cell.td{outline:2px solid var(--ink);outline-offset:1px}
.plan4 li{margin-bottom:6px}
.plan4 li.cur{font-weight:900}
.plan4 li.cur::after{content:" ← 지금";color:var(--accent);font-size:12px}
.rules{list-style:none;padding:0;margin:0}
.rules li{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:15px;display:flex;gap:10px}
.rules li b{font-family:"Black Han Sans";font-weight:400;color:var(--accent)}
.setting{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.setting input{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.sync{font-size:12px;color:var(--muted);margin-top:8px}
/* timer bar */
#timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;transform:translateY(110%);transition:transform .25s;z-index:20}
#timer.show{transform:none}
#timer .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
#timer .t{font-family:"Black Han Sans";font-size:40px;line-height:1;min-width:110px}
#timer .l{flex:1;font-size:13px;color:#cfc8bb;line-height:1.35}
#timer .l b{color:#fff;font-size:15px;display:block}
#timer .bar{position:absolute;left:0;top:0;height:4px;background:var(--accent);transition:width 1s linear}
#timer.end .t{color:var(--accent)}
#timer button{background:#33312d;color:#fff;padding:10px 12px;border-radius:10px;font-weight:700;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:340px;width:100%}
.modal .box p{margin:0 0 14px;line-height:1.5}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.anim{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
.anim svg{width:110px;height:122px;flex:none}
.animsteps{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.vlinks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vlink{display:block;padding:10px 12px;border-radius:10px;background:#e8322a;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.vlink small{display:block;font-weight:400;font-size:12px;opacity:.85}
.vlink.big{margin-top:12px;text-align:center;padding:13px;font-size:15px}
.vlink.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:13px}
.yt{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#111;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:46px;border-radius:12px;background:#e8322a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.yt .ytl{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.yt iframe{width:100%;height:100%;border:0;display:block}
.vform{display:flex;gap:6px}.vform input{flex:1;min-width:0;font:inherit;font-size:13px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
/* 처음 화면 */
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--accent)}
.form{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px 14px}
.form label{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.form label small{color:var(--muted);font-weight:400}
.form label span{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.form input{width:96px;font:inherit;font-size:17px;font-weight:700;text-align:right;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.form .lbl{font-weight:700;font-size:15px;margin:14px 0 8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.row3 .chip{padding:11px 4px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:1em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.rbox .rk{font-size:12px;font-weight:700;color:var(--muted)}.rbox .rv{font-family:"Black Han Sans";font-size:24px;margin:2px 0}.rbox .rs{font-size:13px;color:var(--muted);line-height:1.5}
.exrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.5}
.exrow .tag{flex:none;margin-top:2px}.exrow span:not(.tag){color:var(--muted);font-size:13px}
ul.plain{margin:0;padding-left:18px;line-height:1.7;font-size:14px}
/* 체형 선택 창 */
#onboard{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none}
#onboard.show{display:block}
#onboard .in{max-width:620px;margin:0 auto;padding:28px 18px 40px}
#onboard .step{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
#onboard h2{font-family:"Black Han Sans";font-weight:400;font-size:30px;margin:6px 0 6px}
#onboard p.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px}
.bodies{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.body{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;transition:transform .1s}
.body:active{transform:scale(.97)}
.body svg{width:56px;height:96px;color:#c9c1b2;display:block;margin:0 auto 6px}
.body b{display:block;font-size:14px}
.body small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.body.on{border-color:var(--accent);background:var(--accent-soft)}
.body.on svg{color:var(--accent)}
.preview{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;min-height:60px}
.preview ul{margin:6px 0 0;padding-left:18px}
#onboard .go{width:100%;margin-top:16px;padding:16px;font-size:16px;border-radius:14px}
#onboard .go:disabled{opacity:.35;cursor:default}
#onboard .later{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline}
.bodytips{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.bodytips summary{color:var(--ink);font-size:14px}
.bodytips summary::before,.bodytips[open] summary::before{content:""}
.bodytips .chg{float:right;font-size:12px;color:var(--muted);text-decoration:underline}
.mytip{margin-top:6px;padding:8px 10px;background:var(--accent-soft);border-radius:10px;font-size:13px;color:#7a2a0c}
@media (max-width:380px){.set{width:46px;height:46px}.hero h2{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="brand" data-rebody="1" title="처음 화면으로">HOME<span>.</span>FIT</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="date" id="date"></div>
      <button class="homebtn" data-rebody="1" aria-label="처음 화면으로">⌂<small>처음</small></button>
    </div>
  </header>
  <div class="weekbar" id="weekbar"></div>
  <nav class="tabs">
    <a href="#today" data-tab="today">오늘</a>
    <a href="#week" data-tab="week">이번 주</a>
    <a href="#log" data-tab="log">기록</a>
    <a href="#rules" data-tab="rules">수칙</a>
  </nav>
  <main id="main"></main>
</div>

<div id="timer"><div class="bar" id="tbar"></div><div class="in">
  <div class="t" id="tt">1:30</div>
  <div class="l" id="tl"><b>휴식</b>숨 고르고 다음 세트 준비</div>
  <button id="tplus">+30초</button>
  <button id="tstop">닫기</button>
</div></div>

<div id="onboard"><div class="in" id="obin"></div></div>

<div class="modal" id="modal"><div class="box">
  <p id="mtext"></p>
  <div class="row"><button class="btn ghost sm" id="mno">취소</button><button class="btn sm" id="myes">확인</button></div>
</div></div>

<script>
/* ---------- 운동 계획 데이터 ---------- */
const WARM = {id:"warm", name:"준비운동 루틴", q:"홈트 준비운동 5분", rx:"5분 · 아래 5가지 순서대로", sets:1, work:300, restSec:0, unit:"완료",
  cue:["팔 앞으로 크게 돌리기 10회 → 뒤로 10회","허리에 손 얹고 골반 돌리기 좌우 10회씩","양팔 벌려 몸통 좌우로 비틀기 10회","제자리 무릎 들기 30초 (발 살짝만 들어도 OK)","의자 스쿼트 맨몸으로 5회"], tip:"몸이 살짝 따뜻해질 정도면 충분해요."};


const S = { // 구체적인 동작 모음
 kneeup:{id:"kneeup", name:"제자리 무릎 들기", q:"제자리 무릎 들기 걷기 운동", round:true, work:60, restSec:30, sets:5, unit:"라운드",
   cue:["제자리에서 걷듯이 무릎을 번갈아 들기","팔은 반대쪽 다리와 같이 앞뒤로 흔들기","뛰지 않고 한 발은 항상 바닥에"], tip:"숨이 차지만 대화는 가능한 정도가 딱 좋아요."},
 steptouch:{id:"steptouch", name:"스텝 터치", q:"스텝 터치 운동",
   video:"GSZ7XWcId5Q", round:true, work:60, restSec:30, sets:3, unit:"라운드",
   cue:["오른발 옆으로 한 걸음 → 왼발을 붙이기","반대로 왼쪽으로 한 걸음 → 오른발 붙이기","리듬 있게 반복, 팔은 양옆으로 벌렸다 모으기"], tip:"음악을 틀어놓고 하면 시간이 금방 가요."},
 shadowbox:{id:"shadowbox", name:"섀도 복싱", round:true, work:60, restSec:30, sets:3, unit:"라운드",
   cue:["발을 어깨너비로 벌리고 무릎 살짝 굽히기","왼손 잽 → 오른손 스트레이트를 번갈아 앞으로 뻗기","주먹은 끝까지 뻗되 팔꿈치를 툭 펴서 꺾지 않기"], tip:"뛰지 않고 상체만 써도 숨이 차요."},

/* ---------- 날짜 도우미 ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); };
const md = d => (d.getMonth()+1)+"/"+d.getDate();
const today = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };

let state = {start:null, checks:{}, cond:{}, rest:90, body:null, profile:null, applyRec:false, onboarded:false, videos:{}, updatedAt:0};
const LS = "homefit-v1";
function normalize(s){ s = s||{}; return {start:s.start||null, checks:s.checks||{}, cond:s.cond||{}, rest:s.rest||90, body:BODY[s.body]?s.body:null, onboarded:!!s.onboarded, profile:s.profile||null, applyRec:!!s.applyRec, videos:s.videos||{}, updatedAt:s.updatedAt||0}; }
function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) return normalize(JSON.parse(r)); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
const cloud = {ref:null, writing:false, pending:false, t:null};
let syncMsg = "이 기기에 저장 중";
function setSync(m){ syncMsg=m; const el=document.getElementById("sync"); if(el) el.textContent=m; }
async function flush(){
  if(!cloud.ref) return;
  if(cloud.writing){ cloud.pending=true; return; }
  cloud.writing=true;
  try{ await cloud.ref.set(JSON.parse(JSON.stringify(state))); setSync("저장됨 · 다른 기기에서도 이어서 볼 수 있어요"); }
  catch(e){ if(e && (e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){ cloud.ref=null; setSync("이 기기에만 저장 중"); } }
  cloud.writing=false;
  if(cloud.pending){ cloud.pending=false; flush(); }
}
function save(){ state.updatedAt=Date.now(); saveLocal(); clearTimeout(cloud.t); cloud.t=setTimeout(flush,700); }
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user"); const db = await window.claude.use("db");
    if(!user || !db) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/"+id+"/progress");
    const to = setTimeout(()=>setSync("서버 연결 대기 중 · 이 기기에 저장 중"),10000);
    const snap = await ref.get(); clearTimeout(to);
    cloud.ref = ref;
    if(snap.exists){
      const remote = normalize(snap.data());
      if(remote.updatedAt >= state.updatedAt){ state = remote; saveLocal(); render(); if(state.onboarded) closeOnboard(); }
      else flush();
    } else if(state.updatedAt){ flush(); }
    setSync("저장됨 · 다른 기기에서도 이어서 볼 수 있어요");
  }catch(e){ setSync("이 기기에만 저장 중"); }
}

function weekNum(d){ return Math.floor((monday(d)-monday(parse(state.start)))/(7*864e5))+1; }
function itemsFor(dow){ const p=PLAN[dow]; if(!p.items.length) return []; return (p.type==="strength"?[WARM,...p.items]:p.items).map(recFor); }
function doneSets(dk,it){ const c=state.checks[dk]||{}; let n=0; for(let s=0;s<it.sets;s++) if(c[it.id+"#"+s]) n++; return n; }
function dayProgress(d){
  const dk=key(d), its=itemsFor(d.getDay());
  let tot=0, dn=0; its.forEach(it=>{ tot+=it.sets; dn+=doneSets(dk,it); });
  return {tot, dn, pct: tot? dn/tot : 0};
}
function dayStatus(d){
  const p=PLAN[d.getDay()]; if(p.type==="rest") return "rest";
  const pr=dayProgress(d);
  if(pr.tot && pr.dn===pr.tot) return "ok";
  if(pr.dn>0) return "part";
  if(d>today()) return "plan";
  if(d.getTime()===today().getTime()) return "plan";
  return p.type==="recover" ? "skip" : "miss";
}

function ytId(u){

}

    return `<tr class="${d.getTime()===today().getTime()?"today":""}" data-go="${dw}" style="cursor:pointer"><td>${DAYN[dw]}</td><td><b>${esc(p.name)}</b><br><span style="font-size:12px;color:var(--muted)">${md(d)} · ${esc(p.time)}</span></td><td>${tag}</td></tr>`;

let audio=null;
function beep(){ try{ if(!audio) return; const t=audio.currentTime; [0,0.25,0.5].forEach(o=>{ const g=audio.createGain(), os=audio.createOscillator(); os.frequency.value=880; os.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.3,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18); os.start(t+o); os.stop(t+o+0.2); }); }catch(e){} try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
function unlockAudio(){ try{ if(!audio){ const A=window.AudioContext||window.webkitAudioContext; if(A) audio=new A(); } if(audio && audio.state==="suspended") audio.resume(); }catch(e){} }
const T={end:0,total:0,iv:null,label:"",sub:""};
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+pad(s%60); }
function startTimer(sec,label,sub){
  unlockAudio(); T.total=sec; T.end=Date.now()+sec*1000; T.label=label; T.sub=sub;
  $("#timer").classList.add("show"); $("#timer").classList.remove("end");
  $("#tl").innerHTML=`<b>${esc(label)}</b>${esc(sub)}`;
  clearInterval(T.iv); tick(); T.iv=setInterval(tick,250);
}
function tick(){
  const left=(T.end-Date.now())/1000;
  $("#tt").textContent=fmt(left);
  $("#tbar").style.width=Math.max(0,Math.min(100,100-(left/T.total)*100))+"%";
  if(left<=0){ clearInterval(T.iv); $("#timer").classList.add("end"); $("#tt").textContent="0:00"; $("#tl").innerHTML=`<b>시간 끝!</b>${esc(T.label.startsWith("휴식")?"다음 세트 시작":"완료 체크 잊지 마세요")}`; beep(); }
}
$("#tplus").onclick=()=>{ unlockAudio(); if(Date.now()>T.end){ T.end=Date.now()+30000; T.total=30; $("#timer").classList.remove("end"); $("#tl").innerHTML=`<b>${esc(T.label)}</b>${esc(T.sub)}`; clearInterval(T.iv); T.iv=setInterval(tick,250);} else { T.end+=30000; T.total+=30; } tick(); };
$("#tstop").onclick=()=>{ clearInterval(T.iv); $("#timer").classList.remove("show"); };

const EXP = {none:"처음이에요", short:"1~3개월", long:"3개월 이상"};
function recommend(st){
  const p = st.profile||{}, body = st.body, age = +p.age||0, h = +p.height||0, w = +p.weight||0;
  const bmi = (h && w) ? w/((h/100)**2) : 0;
  const kid = age && age<14, teen = age>=14 && age<19, mid = age>=40 && age<60, senior = age>=60;
  const joint = bmi>=30 || body==="large" || senior;
  const easy = joint || body==="chubby" || p.exp==="none" || kid;
  const exp = p.exp||"none";
  const r = {tags:[], cautions:[], ex:{}};
  if(kid) r.tags.push("어린이"); if(teen) r.tags.push("성장기"); if(mid) r.tags.push("40대 이상"); if(senior) r.tags.push("60대 이상");
  if(joint) r.tags.push("관절 보호"); r.tags.push(exp==="none"?"입문":exp==="short"?"초급":"중급 준비");
  // 근력 강도
  if(exp==="long" && !joint && !kid){ r.reps="10~12회"; r.sets=2; r.sets4=3; r.rest=60; }
  else if(exp==="short" && !easy){ r.reps="10회"; r.sets=2; r.sets4=3; r.rest=90; }
  else if(exp==="short"){ r.reps="8~10회"; r.sets=2; r.sets4=2; r.rest=90; }
  else { r.reps = joint?"8회":"8~10회"; r.sets=2; r.sets4=2; r.rest = joint?120:90; }
  r.weight = kid ? "덤벨 대신 맨몸이나 아주 가벼운 물건(물병)으로. 덤벨은 보호자와 함께."
           : "마지막 2~3회가 힘들지만 자세는 무너지지 않는 무게. 확신이 없으면 가벼운 쪽으로.";
  // 유산소
  if(joint){ r.cardio={work:40, plus:0, text:"1분 대신 40초씩, 숨 고르며"}; }
  else if(body==="slim"){ r.cardio={work:60, plus:-1, text:"1분씩, 라운드는 하나 줄여서"}; }
  else if(exp==="long"){ r.cardio={work:60, plus:1, text:"1분씩, 라운드 하나 더"}; }
  else { r.cardio={work:60, plus:0, text:"계획대로 1분씩 (대화 가능한 속도)"}; }
  // 운동별
  const E=(id,tag,text)=>{ r.ex[id]={tag,text}; };
  if(joint){
    E("chairsquat","추천","의자에 쿠션을 올려 높이고 시작하세요. 가장 안전한 하체 운동이에요.");
    E("goblet","바꿔서","처음 2주는 덤벨 없이 의자 스쿼트로 하고, 편해지면 의자를 뒤에 둔 채 고블릿 스쿼트로.");
    E("rdl","주의","덤벨 1개를 두 손으로 잡고 가볍게. 허리가 당기면 깊이를 줄이세요.");
    E("floorpress","주의","눕고 일어날 때 옆으로 돌아 손으로 짚고 천천히.");
    E("birddog","바꿔서","처음엔 팔 하나 또는 다리 하나만 뻗기부터.");
    E("kneeup","바꿔서","무릎을 높이 들지 말고 발을 살짝만 들기. 의자 등받이를 잡아도 OK.");
    E("shadowbox","추천","관절 충격 없이 숨이 차는 좋은 유산소예요.");
    E("bridge","추천","관절 부담이 적어 꼭 챙기면 좋은 운동이에요.");
  }
  if(kid){ E("ohp","주의","무게 없이 동작만 먼저 익히세요."); E("lateral","바꿔서","물병이나 맨손으로."); }
  else E("lateral", joint||exp==="none"?"바꿔서":"주의", joint||exp==="none" ? "7kg 덤벨은 이 동작엔 무거워요. 물 채운 페트병으로 시작하세요." : "가장 무게에 예민한 동작이에요. 어깨가 으쓱하면 무게를 줄이세요.");
  if(exp==="long" && !joint){ E("chairsquat","바꿔서","의자에 앉지 말고 닿기 직전에 멈췄다 일어나기로 강도를 올려요."); }
  if(body==="muscular") E("curl","주의","반동을 쓰기 쉬워요. 팔꿈치 고정.");
  // 주차별
  r.weeks = [
    "자세 익히기: "+r.reps+" × "+r.sets+"세트, 무게는 가장 가볍게",
    "습관 만들기: 같은 강도로 빠지지 않고 5일 채우기",
    joint ? "컨디션이 좋으면 한 운동씩 1~2회만 더하기" : "컨디션이 좋으면 각 운동 +2회",
    r.sets4>r.sets ? "자세가 안정적이면 3세트까지" : "1주 차와 비교해 편해진 동작 확인, 무리해서 늘리지 않기"
  ];
  // 주의
  if(kid) r.cautions.push("어린이는 맨몸 운동과 놀이 같은 활동 위주가 좋아요. 무게 운동은 보호자와 함께하세요.");
  if(teen) r.cautions.push("성장기예요. 최대 무게 도전이나 무리한 체중 감량·식사 제한은 피하고, 보호자 및 의료진과 상의하며 조절하세요.");
  if(joint) r.cautions.push("점프·달리기 없이 뛰지 않는 동작만. 무릎·허리가 아프면 그 운동은 쉬세요.");
  if(mid) r.cautions.push("준비운동을 10분으로 늘리면 좋아요.");
  if(senior) r.cautions.push("균형을 위해 의자나 벽을 잡을 수 있는 곳에서 하세요. 새 운동을 시작하기 전 의사와 상의하세요.");
  r.cautions.push("통증, 어지러움, 가슴 답답함이 있으면 바로 멈추세요.");
  return r;
}
function baseRx(it){
  if(it.round){ const w=it.work>=60?(it.work/60)+"분":it.work+"초"; return w+" × "+it.sets+"라운드 · 쉬기 "+it.restSec+"초"; }
  return it.rx;
}
function recFor(it){ // 적용된 추천으로 운동 처방 바꾸기
  if(!state.applyRec || !state.profile || it.id==="warm" || it.stretch || it.unit==="완료"){ return {...it, rx:baseRx(it)}; }
  const r=recommend(state);
  if(it.round){ const x={...it, work:r.cardio.work, sets:Math.max(1,it.sets+r.cardio.plus)}; return {...x, rx:baseRx(x)}; }
  if(it.id==="calfraise") return {...it, rx:baseRx(it)};
  const wk = weekNum(today()), sets = wk>=4 ? r.sets4 : r.sets;
  const lr = /좌우/.test(it.rx) ? "좌우 " : "";
  return {...it, sets, rx: lr+r.reps+" × "+sets+"세트"};
}

/* ---------- 처음 화면 (3단계) ---------- */
let ob = {step:1, body:null, p:{}};
function obHead(n,title,lead){
  return `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>
  <div class="step">${n}/3 단계</div><h2>${title}</h2><p class="lead">${lead}</p>`;
}
function drawOnboard(){
  let h="";
  if(ob.step===1){
    const v=BODY[ob.body];
    h = obHead(1,"내 체형을 골라주세요","가장 비슷한 체형 하나를 골라주세요.")
      + `<div class="bodies">${Object.entries(BODY).map(([k,v])=>`<button class="body ${ob.body===k?"on":""}" data-body="${k}">${fig(v.f)}<b>${esc(v.name)}</b><small>${esc(v.desc)}</small></button>`).join("")}</div>`
      + `<button class="btn go" data-ob="next1" ${v?"":"disabled"}>다음</button>`
      + `<button class="later" data-ob="skip">${state.onboarded?"← 운동 화면으로 돌아가기":"건너뛰기"}</button>`;
  } else if(ob.step===2){
    const p=ob.p;
    h = obHead(2,"조금 더 알려주세요","나이와 키를 넣으면 운동 강도와 방법을 맞춰 추천해드려요. 체중은 넣으면 더 정확하지만 선택이에요.")
      + `<div class="form">
        <label>나이<span><input type="number" inputmode="numeric" id="fAge" min="8" max="90" value="${esc(p.age||"")}" placeholder="17"> 세</span></label>
        <label>키<span><input type="number" inputmode="decimal" id="fH" min="120" max="220" value="${esc(p.height||"")}" placeholder="177"> cm</span></label>
        <label>체중 <small>(선택)</small><span><input type="number" inputmode="decimal" id="fW" min="25" max="250" value="${esc(p.weight||"")}" placeholder="—"> kg</span></label>
        <div class="lbl">운동 경험</div>
        <div class="row3">${Object.entries(EXP).map(([k,l])=>`<button class="chip ${p.exp===k?"on":""}" data-exp="${k}">${l}</button>`).join("")}</div>
        <div class="err" id="fErr"></div>
      </div>
      <button class="btn go" data-ob="next2">추천 받기</button>
      <button class="later" data-ob="back">← 체형 다시 고르기</button>`;
  } else {
    const tmp = {...state, body:ob.body, profile:ob.p}, r=recommend(tmp), B=BODY[ob.body];
    const all=[...PLAN[1].items,...PLAN[3].items,...PLAN[5].items,...PLAN[2].items,...PLAN[4].items].filter(it=>!it.stretch&&it.unit!=="완료");
    const seen=new Set(); const list=all.filter(it=>!seen.has(it.id)&&seen.add(it.id));
    h = obHead(3,"나의 맞춤 추천", `${esc(B.name)} · ${esc(ob.p.age)}세 · ${esc(ob.p.height)}cm${ob.p.weight?" · "+esc(ob.p.weight)+"kg":""} · 경험 ${esc(EXP[ob.p.exp])}`)
      + `<div class="tags">${r.tags.map(t=>`<span class="tag part">${esc(t)}</span>`).join(" ")}</div>
      <div class="rbox"><div class="rk">근력 운동</div><div class="rv">${esc(r.reps)} × ${r.sets}세트</div><div class="rs">세트 사이 휴식 ${r.rest===60?"1분":r.rest===90?"1분 30초":"2분"} · ${esc(r.weight)}</div></div>
      <div class="rbox"><div class="rk">유산소 서킷 (화·목)</div><div class="rv">${esc(r.cardio.text)}</div></div>
      <h4 class="sec">운동별 추천</h4>
      <div class="exlist">${list.map(it=>{ const x=r.ex[it.id]||(B.ex[it.id]?{tag:"팁",text:B.ex[it.id]}:{tag:"추천",text:"계획대로 하면 돼요."}); const c=x.tag==="추천"?"ok":x.tag==="바꿔서"?"part":"miss"; return `<div class="exrow"><span class="tag ${c}">${x.tag}</span><div><b>${esc(it.name)}</b><br><span>${esc(x.text)}</span></div></div>`; }).join("")}</div>
      <h4 class="sec">4주 동안 이렇게</h4><ol class="plan4">${r.weeks.map(w=>`<li>${esc(w)}</li>`).join("")}</ol>
      <h4 class="sec">${esc(B.name)} 팁</h4><ul class="plain">${B.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
      <div class="safety"><span>⚠️</span><span>${r.cautions.map(esc).join("<br>")}</span></div>
      <p style="font-size:12px;color:var(--muted);line-height:1.6">일반적인 운동 가이드예요. 의사·트레이너의 조언이 있으면 그걸 먼저 따르세요.</p>
      <button class="btn go" data-ob="apply">이 추천으로 운동하기</button>
      <button class="btn ghost go" style="margin-top:8px" data-ob="keep">원래 계획대로 하기 (팁만 보기)</button>
      <button class="later" data-ob="back">← 정보 고치기</button>`;
  }
  $("#obin").innerHTML=h; $("#onboard").scrollTop=0;
}
function readForm(){
  const age=+$("#fAge").value, hgt=+$("#fH").value, wv=$("#fW").value, wt=wv===""?null:+wv;
  ob.p.age=$("#fAge").value; ob.p.height=$("#fH").value; ob.p.weight=wv;
  if(!(age>=8&&age<=90)) return "나이를 8~90 사이로 넣어주세요.";
  if(!(hgt>=120&&hgt<=220)) return "키를 120~220cm 사이로 넣어주세요.";
  if(wt!==null && !(wt>=25&&wt<=250)) return "체중은 비워두거나 25~250kg 사이로 넣어주세요.";
  if(!ob.p.exp) return "운동 경험을 골라주세요.";
  return "";
}
function openOnboard(step){ ob={step:step||1, body:state.body, p:{...(state.profile||{})}}; if(ob.step===3 && !(ob.body&&state.profile)) ob.step=1; drawOnboard(); $("#onboard").classList.add("show"); }
function closeOnboard(){ $("#onboard").classList.remove("show"); }
$("#onboard").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; e.stopPropagation();
  if(b.dataset.body){ ob.body=b.dataset.body; drawOnboard(); return; }
  if(b.dataset.exp){ readForm(); ob.p.exp=b.dataset.exp; drawOnboard(); return; }
  const a=b.dataset.ob;
  if(a==="next1" && ob.body){ ob.step=2; drawOnboard(); }
  else if(a==="next2"){ const err=readForm(); if(err){ $("#fErr").textContent=err; return; } ob.step=3; drawOnboard(); }
  else if(a==="back"){ if(ob.step===2) readForm(); ob.step--; drawOnboard(); }
  else if(a==="skip"){ if(!state.onboarded){ state.onboarded=true; save(); } closeOnboard(); render(); }
  else if(a==="apply"||a==="keep"){
    state.body=ob.body; state.profile={...ob.p}; state.onboarded=true; state.applyRec=(a==="apply");
    if(a==="apply") state.rest=recommend(state).rest;
    save(); closeOnboard(); location.hash="today"; selDow=today().getDay(); render();
  }
});

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const y=e.target.closest(".yt[data-play]");
  if(y){ const id=y.dataset.play; y.removeAttribute("data-play"); y.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="운동 영상"></iframe>`; return; }
  const b=e.target.closest("button,tr[data-go]"); if(!b) return;
  if(b.dataset.vsave){ const inp=document.querySelector(`[data-vin="${b.dataset.vsave}"]`); const id=ytId(inp&&inp.value); if(!id){ inp.value=""; inp.placeholder="유튜브 주소가 아니에요. 다시 붙여넣어 주세요."; inp.focus(); return; } state.videos[b.dataset.vsave]=id; save(); render(); return; }
  if(b.dataset.vdel){ delete state.videos[b.dataset.vdel]; save(); render(); return; }
  if(b.dataset.rebody){ e.preventDefault(); openOnboard(+b.dataset.rebody); return; }
  if(b.id==="recToggle"){ state.applyRec=!state.applyRec; save(); render(); return; }
  if(b.dataset.dow!==undefined){ selDow=+b.dataset.dow; render(); return; }
  if(b.dataset.go!==undefined){ selDow=+b.dataset.go; location.hash="today"; return; }
  if(b.dataset.rest){ state.rest=+b.dataset.rest; save(); render(); return; }
  if(b.dataset.cond){ const dk=b.dataset.dk; state.cond[dk] = state.cond[dk]===b.dataset.cond?undefined:b.dataset.cond; if(!state.cond[dk]) delete state.cond[dk]; save(); render(); return; }
  if(b.dataset.run){ startTimer(+b.dataset.run, b.dataset.name, "끝나면 체크하기"); return; }
  if(b.dataset.set){
    const dk=key(selDate()); const c=state.checks[dk]=state.checks[dk]||{}; const k=b.dataset.set;
    if(c[k]) delete c[k]; else {
      c[k]=true;
      const [id,s]=k.split("#"); const it=itemsFor(selDow).find(x=>x.id===id);
      const rest = it ? (it.restSec!==undefined ? it.restSec : state.rest) : 0;
      if(it && rest>0){
        const allDone = dayProgress(selDate()).dn===dayProgress(selDate()).tot;
        if(!allDone) startTimer(rest, "휴식 "+fmt(rest), b.dataset.last==="1"?"다음 운동 준비":"다음 "+(it.unit||"세트")+" 준비");
      }
    }
    if(!Object.keys(c).length) delete state.checks[dk];
    save(); render(); return;
  }
  if(b.id==="resetBtn"){ ask("모든 체크와 컨디션 기록을 지울까요? 되돌릴 수 없어요.",()=>{ state.checks={}; state.cond={}; save(); render(); }); return; }
});
document.addEventListener("change",e=>{
  if(e.target.id==="startIn" && e.target.value){ state.start=e.target.value; save(); render(); }
});
function route(){ const h=(location.hash||"").slice(1); tab=["today","week","log","rules"].includes(h)?h:"today"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);

/* ---------- 시작 ---------- */
const local=loadLocal(); if(local) state=local;
route();
if(!state.onboarded) openOnboard();
// 자정이 지나면 오늘 날짜 갱신
let lastDay=key(today()); setInterval(()=>{ if(key(today())!==lastDay){ lastDay=key(today()); selDow=today().getDay(); render(); } },60000);
</script>
</body>
</html>
