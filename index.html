<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOME.FIT 홈트레이닝</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f2ea">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HOME.FIT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1c1b19; --muted:#6f6a60; --line:#e4ded1;
  --accent:#ff5a1f; --accent-soft:#ffe6da; --ok:#2a9a62; --ok-soft:#dcf2e6;
  --cardio:#2f6fdc; --cardio-soft:#e0eafc; --rest:#8a8378; --rest-soft:#ece8df;
  --warn:#b4451f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 140px calc(16px + env(safe-area-inset-left))}
#onboard .in{padding-top:calc(28px + env(safe-area-inset-top))!important}
.installbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:12px}.installbar img{width:40px;height:40px;border-radius:10px}.installbar div{flex:1;font-size:12.5px;line-height:1.4}.installbar b{display:block;font-size:14px}.installbar span{color:#cfc8bb}.installbar .btn{background:var(--accent)}.installbar .x{color:#cfc8bb;font-size:20px;padding:0 4px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 14px}
.brand{font-family:"Black Han Sans",sans-serif;font-size:30px;line-height:1;letter-spacing:.5px}
.brand span{color:var(--accent)}
button.brand{padding:0;text-align:left}
.homebtn{width:46px;height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:20px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.homebtn small{font-size:10px;color:var(--muted);margin-top:2px}
.date{font-size:13px;color:var(--muted);text-align:right;line-height:1.4}
.date b{color:var(--ink)}
.weekbar{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.weekbar .wk{font-family:"Black Han Sans";font-size:26px;color:var(--accent);white-space:nowrap}
.weekbar .focus{font-size:14px;line-height:1.45}
.weekbar .focus small{display:block;color:#bdb6aa;font-size:12px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--rest-soft);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5}
nav.tabs a{text-align:center;padding:10px 2px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted);text-decoration:none}
nav.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{padding:8px 0 7px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:15px;position:relative}
.day small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}
.day.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.day.sel small{color:#cfc8bb}
.day.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.done.sel{background:var(--ok);border-color:var(--ok)}
.hero{border-radius:18px;padding:18px;margin-bottom:12px;background:var(--accent-soft)}
.hero.cardio{background:var(--cardio-soft)}
.hero.rest{background:var(--rest-soft)}
.hero .kind{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.hero.cardio .kind{color:var(--cardio)} .hero.rest .kind{color:var(--rest)}
.hero h2{font-family:"Black Han Sans";font-weight:400;font-size:32px;margin:4px 0 6px}
.hero .meta{font-size:14px;color:var(--muted)}
.prog{height:8px;background:rgba(0,0,0,.08);border-radius:8px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.hero.cardio .prog i{background:var(--cardio)}
.prog-lbl{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.restpick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px}
.card.complete{border-color:var(--ok);background:#f7fcf9}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:900}
.card .rx{font-size:14px;color:var(--accent);font-weight:700;margin-top:2px}
.card.cardio-item .rx{color:var(--cardio)}
.num{font-family:"Black Han Sans";font-size:15px;color:var(--muted);min-width:22px}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.set{width:52px;height:52px;border-radius:14px;border:2px dashed #cfc7b8;font-weight:900;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.set small{font-size:10px;font-weight:500}
.set.on{border:2px solid var(--ok);background:var(--ok);color:#fff}
.set.on small{color:#e6fff1}
.btn{padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--cardio)}
.btn.sm{padding:8px 11px;font-size:13px}
details{margin-top:10px;font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ "} details[open] summary::before{content:"－ "}
details ul{margin:8px 0 0;padding-left:18px;line-height:1.6}
details .tip{margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:13px;color:var(--muted)}
.safety{display:flex;gap:10px;align-items:flex-start;background:#fff3ee;border:1.5px solid #ffc9b3;color:var(--warn);padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;margin:14px 0}
.cond{margin-top:14px}
.cond .row{display:flex;gap:6px;margin-top:8px}
.cond .row .chip{flex:1;text-align:center;padding:10px 4px}
.done-banner{background:var(--ok);color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:700;margin:12px 0}
.done-banner b{font-family:"Black Han Sans";font-weight:400;font-size:22px;display:block}
h4.sec{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
table.wk{width:100%;border-collapse:separate;border-spacing:0 6px}
table.wk tr{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.05)}
table.wk tr:active td{background:var(--bg)}
table.wk td{background:var(--card);padding:12px 10px;font-size:14px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
table.wk td:first-child{border-left:1.5px solid var(--line);border-radius:12px 0 0 12px;font-weight:900;width:44px;text-align:center}
table.wk td:last-child{border-right:1.5px solid var(--line);border-radius:0 12px 12px 0;text-align:right;white-space:nowrap}
table.wk tr.today td{border-color:var(--ink)}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.part{background:var(--accent-soft);color:var(--accent)}
.tag.miss{background:var(--rest-soft);color:var(--muted)}
.tag.plan{background:transparent;color:var(--muted);border:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{font-family:"Black Han Sans";font-weight:400;font-size:26px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.grid28{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:center}
.grid28 .h{font-size:11px;color:var(--muted);text-align:center}
.grid28 .wl{font-size:11px;font-weight:700;color:var(--muted);padding-right:4px}
.cell{aspect-ratio:1;border-radius:8px;background:var(--rest-soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cell.ok{background:var(--ok);color:#fff}
.cell.part{background:#ffc4ab;color:#7a2a0c}
.cell.fut{background:transparent;border:1.5px dashed var(--line)}
.cell.td{outline:2px solid var(--ink);outline-offset:1px}
.plan4 li{margin-bottom:6px}
.plan4 li.cur{font-weight:900}
.plan4 li.cur::after{content:" ← 지금";color:var(--accent);font-size:12px}
.rules{list-style:none;padding:0;margin:0}
.rules li{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:15px;display:flex;gap:10px}
.rules li b{font-family:"Black Han Sans";font-weight:400;color:var(--accent)}
.setting{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.setting input{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.sync{font-size:12px;color:var(--muted);margin-top:8px}
/* timer bar */
#timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;transform:translateY(110%);transition:transform .25s;z-index:20}
#timer.show{transform:none}
#timer .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
#timer .t{font-family:"Black Han Sans";font-size:40px;line-height:1;min-width:110px}
#timer .l{flex:1;font-size:13px;color:#cfc8bb;line-height:1.35}
#timer .l b{color:#fff;font-size:15px;display:block}
#timer .bar{position:absolute;left:0;top:0;height:4px;background:var(--accent);transition:width 1s linear}
#timer.end .t{color:var(--accent)}
#timer button{background:#33312d;color:#fff;padding:10px 12px;border-radius:10px;font-weight:700;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:340px;width:100%}
.modal .box p{margin:0 0 14px;line-height:1.5}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.anim{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
.anim svg{width:110px;height:122px;flex:none}
.animsteps{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.vlinks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vlink{display:block;padding:10px 12px;border-radius:10px;background:#e8322a;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.vlink small{display:block;font-weight:400;font-size:12px;opacity:.85}
.vlink.big{margin-top:12px;text-align:center;padding:13px;font-size:15px}
.vlink.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:13px}
.yt{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#111;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:46px;border-radius:12px;background:#e8322a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.yt .ytl{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.yt iframe{width:100%;height:100%;border:0;display:block}
.vform{display:flex;gap:6px}.vform input{flex:1;min-width:0;font:inherit;font-size:13px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.streak{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.streak.on{background:linear-gradient(135deg,#fff1e8,#ffe0cf);border-color:#ffc4a8}
.streak .fire{font-size:30px;filter:grayscale(1);opacity:.5}
.streak.on .fire{filter:none;opacity:1}
.streak .sn{font-family:"Black Han Sans";font-size:26px;line-height:1}.streak .sn small{font-family:"Noto Sans KR";font-size:13px;font-weight:700;margin-left:3px}
.streak .sm{font-size:13px;color:var(--muted);margin-top:3px}.streak .sm b{color:var(--accent)}
.streak>div:nth-child(2){flex:1}
.streak .sb{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}.streak .sb b{font-size:15px;color:var(--ink)}
.mesec{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.mesec.form{padding:12px 14px}
.mesec h4{margin:0 0 8px;font-size:15px}
.mesec .lbl{font-weight:700;font-size:13px;color:var(--muted);margin:12px 0 6px}
.mechips{display:flex;flex-wrap:wrap;gap:6px}.mechips .chip{padding:9px 12px}
.meres{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:14px;margin-top:14px}
.meres.ok{border-color:var(--ok);font-weight:700}
.meres h4{margin:0 0 4px;font-size:16px}.meres .rs{font-size:12.5px;color:var(--muted);line-height:1.5}
.drow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55}
.drow>b{width:18px;flex:none;color:var(--accent)}
.dold{text-decoration:line-through;color:var(--muted)}.dminus{color:#b4451f}.dplus{color:var(--ok)}
input::placeholder{color:#c9c1b2;font-weight:500}
.eqsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.eqchip{display:inline-flex;align-items:center;gap:4px;padding:7px 6px 7px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.eqchip.ref{background:var(--rest-soft);color:var(--ink)}
.eqchip small{font-weight:500;font-size:10.5px;opacity:.75}
.eqchip button{width:22px;height:22px;border-radius:50%;color:inherit;font-size:15px;line-height:1;opacity:.75}
.eqadd{width:38px;height:38px;border-radius:50%;border:2px dashed var(--accent);color:var(--accent);font-size:22px;font-weight:700;line-height:1}
.eqpanel{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.eqpanel input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#eqList{max-height:340px;overflow-y:auto;margin-top:8px}
.eqg{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 2px 4px}
.eqrow{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:5px}
.eqrow b{display:block;font-size:14px}.eqrow span{font-size:12px;color:var(--muted)}
.eqrow.custom{border-style:dashed}
.ratiobar{height:10px;border-radius:10px;background:var(--cardio);overflow:hidden;margin:2px 0 4px}.ratiobar i{display:block;height:100%;background:var(--accent)}
.ratiol{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:10px}.ratiol span:first-child{color:var(--accent)}.ratiol span:last-child{color:var(--cardio)}
.manbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.manbar.on{border-style:solid;border-color:var(--ok);background:#f3fbf6}
.edtop p{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 8px}.edbtns{display:flex;gap:6px;margin-bottom:12px}
.edday{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.edday.strength{border-left:5px solid var(--accent)}.edday.cardio{border-left:5px solid var(--cardio)}.edday.recover,.edday.rest{border-left:5px solid var(--rest)}
.edhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.edhead b{font-family:"Black Han Sans";font-weight:400;font-size:20px}
.edname{flex:1;font:inherit;font-weight:700;font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.edrow{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;background:#fffdf8}
.er1{display:flex;align-items:center;gap:6px}.edexname{flex:1;min-width:0;font:inherit;font-weight:700;font-size:14px;border:0;border-bottom:1.5px dashed var(--line);background:transparent;padding:4px 0;color:var(--ink)}
.ermv{display:flex;gap:2px}.ermv button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-size:13px}
.er2{margin:6px 0}.modes{display:inline-flex;background:var(--bg);border-radius:9px;padding:2px}.modes button{padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--muted)}.modes button.on{background:var(--ink);color:#fff}
.er3{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}.stepper button{width:30px;height:32px;background:var(--bg);font-weight:700}.stepper b{min-width:26px;text-align:center}
.edin{font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.edrest{color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.edadd{display:block;width:100%;margin-top:8px;padding:10px;border:2px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:700}
.edsave{position:sticky;bottom:10px;display:flex;gap:8px;background:var(--bg);padding:8px 0}.edsave .btn{flex:1;padding:14px}
#edList{max-height:320px;overflow-y:auto;margin-top:8px}
.row7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.row7 .chip{padding:10px 0;text-align:center}
/* 처음 화면 */
.steps{display:flex;gap:6px;margin:-8px 0 6px}.steps button{flex:1;padding:10px 0;background:none;cursor:default}.steps button i{display:block;height:5px;border-radius:5px;background:var(--line)}.steps button.on i{background:var(--accent)}.steps button.back{cursor:pointer}.steps button.back:active i{opacity:.6}
.form{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px 14px}
.form label{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.form label small{color:var(--muted);font-weight:400}
.form label span{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.form input{width:96px;font:inherit;font-size:17px;font-weight:700;text-align:right;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.form .lbl{font-weight:700;font-size:15px;margin:14px 0 8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.row3 .chip{padding:11px 4px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:1em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.rbox .rk{font-size:12px;font-weight:700;color:var(--muted)}.rbox .rv{font-family:"Black Han Sans";font-size:24px;margin:2px 0}.rbox .rs{font-size:13px;color:var(--muted);line-height:1.5}
.exrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.5}
.exrow .tag{flex:none;margin-top:2px}.exrow span:not(.tag){color:var(--muted);font-size:13px}
ul.plain{margin:0;padding-left:18px;line-height:1.7;font-size:14px}
.envf .lbl small{color:var(--muted);font-weight:400}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.row4 .chip,.row3 .chip{padding:11px 4px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.wkprev{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:10px}
.wkrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.wkrow:last-child{border-bottom:0}
.wkrow>b{width:20px;flex:none;font-family:"Black Han Sans";font-weight:400;font-size:16px;color:var(--accent)}
.wkrow.cardio>b{color:var(--cardio)} .wkrow.rest>b,.wkrow.recover>b{color:var(--rest)}
.wkrow .wn{font-weight:700}.wkrow .wt{font-size:12px;color:var(--muted)}.wkrow .wi{font-size:13px;color:var(--muted)}
/* 체형 선택 창 */
#onboard{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none}
#onboard.show{display:block}
#onboard .in{max-width:620px;margin:0 auto;padding:28px 18px 40px}
#onboard .step{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
#onboard h2{font-family:"Black Han Sans";font-weight:400;font-size:30px;margin:6px 0 6px}
#onboard p.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px}
.bodies{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bodies .body{grid-column:span 2}
.bodies .body:nth-child(-n+2){grid-column:span 3}
.body{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;transition:transform .1s}
.body:active{transform:scale(.97)}
.body svg{width:56px;height:96px;color:#c9c1b2;display:block;margin:0 auto 6px}
.body b{display:block;font-size:14px}
.body small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.body.on{border-color:var(--accent);background:var(--accent-soft)}
.body.on svg{color:var(--accent)}
.preview{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;min-height:60px}
.preview ul{margin:6px 0 0;padding-left:18px}
#onboard .go{width:100%;margin-top:16px;padding:16px;font-size:16px;border-radius:14px}
#onboard .go:disabled{opacity:.35;cursor:default}
#onboard .later{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline}
.bodytips{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.bodytips summary{color:var(--ink);font-size:14px}
.bodytips summary::before,.bodytips[open] summary::before{content:""}
.bodytips .chg{float:right;font-size:12px;color:var(--muted);text-decoration:underline}
.mytip{margin-top:6px;padding:8px 10px;background:var(--accent-soft);border-radius:10px;font-size:13px;color:#7a2a0c}
@media (max-width:380px){.set{width:46px;height:46px}.hero h2{font-size:28px}}
</style>

function fig(f){
  const cx=30, top=27, w=f.bw+f.sh, x=cx-w/2;
  const legW=Math.max(f.lw+1, f.bw/2-1);
  return `<svg viewBox="0 0 60 110" fill="currentColor" aria-hidden="true">
    <circle cx="30" cy="13" r="9"/>
    <rect x="${x}" y="${top}" width="${w}" height="${f.sh?10:12}" rx="${Math.min(f.rx,6)}"/>
    <rect x="${cx-f.bw/2}" y="${top+4}" width="${f.bw}" height="38" rx="${f.rx}"/>
    <rect x="${x-f.lw-1.5}" y="${top+1}" width="${f.lw}" height="34" rx="${f.lw/2}"/>
    <rect x="${x+w+1.5}" y="${top+1}" width="${f.lw}" height="34" rx="${f.lw/2}"/>
    <rect x="${cx-legW-1}" y="${top+38}" width="${legW}" height="42" rx="${legW/2.4}"/>
    <rect x="${cx+1}" y="${top+38}" width="${legW}" height="42" rx="${legW/2.4}"/>
  </svg>`;
}

function buildPlan(st){
  const e=st.env, eq=e.eq||{}, pain=e.pain||{};

    pull:[["latpull",has("latm")],["assistpu",has("assistpu")&&!pain.shoulder&&exp!=="none"],["trxrow",has("trx")],["onearm",has("db")&&sup],["bandrow",has("band")],["row",has("db")&&!pain.back],["bottlerow",!pain.back],["yraise",true]],

    squat:[["legpress",has("legpressm")],["trxsquat",has("trx")],["ballsquat",has("ball")],["chairsquat",has("chair")],["bwsquat",!pain.knee],["bridge",true]],
    squat2:[["kbgoblet",has("kb")&&!pain.knee],["goblet",has("db")&&!pain.knee],["legpress",has("legpressm")],["legext",has("legext")&&!pain.knee&&!joint],["ballsquat",has("ball")],["sideleg",pain.knee],["chairsquat",has("chair")],["bwsquat",true]],
    hinge:[["legcurl",pain.back&&has("legcurlm")],["bandbridge",pain.back&&has("band")],["bridge",pain.back],["kbdl",has("kb")],["barbellrdl",has("barbell")&&exp!=="none"],["rdl",has("db")],["legcurl",has("legcurlm")],["hiphinge",true]],
    glute:[["abductor",has("abductor")],["bandbridge",has("band")],["bridge",true]],
    core:[["deadbug",pain.back],["rollout",has("abroller")&&exp==="long"&&!pain.back],["birddog",true]],
    shoulder:[["yraise",pain.shoulder],["machineohp",has("shoulderm")],["ohp",has("db")],["bandohp",has("band")],["bottlepress",true]],
    lateral:[["__none",pain.shoulder],["bandlateral",has("band")],["lateral",has("db")],["bottlelateral",true]],

  const pickSlot = (s, used) => { for(const [id,ok] of C[s]){ if(!ok) continue; if(id==="__none") return null; if(!used.includes(id)) return id; } return null; };

  const perEx = sets*(45 + (R.rest||90))/60;
  const warmMin = T<=10 ? 3 : 5;

  function strengthDay(name, slots){

    const chosen = ids.slice(0,n).map((id,i)=>({id,i})).sort((a,b)=>(ORDER_RANK[a.id]||2)-(ORDER_RANK[b.id]||2) || a.i-b.i).map(x=>x.id);
    const items = chosen.map(id=>{ const x=LIB[id]||S_[id]; if(x.fixedRx) return {...x, gen:true, rx:x.fixedRx}; return {...x, gen:true, sets, rx:(LR[id]?"좌우 ":"")+R.reps+" × "+sets+"세트"}; });
    const rem = Math.min(finMin, T - warmMin - Math.min(ids.length,n)*perEx);
    if(rem>=4){
      if(machines.length){ const mins = Math.max(5, Math.round(rem/5)*5); const mi=machineItem(machines[0], mins); items.push({...mi, id:mi.id+"-fin", base:mi.id, name:mi.name+" (마무리 유산소)"}); }
      else { const m = cardioMoves()[0]; const rounds = Math.max(2, Math.min(12, Math.round(rem*60/((m.id==="rope"?30:R.cardio.work)+30)))); items.push({...m, id:m.id+"-fin", base:m.id, gen:true, name:m.name+" (마무리 유산소)", work:m.id==="rope"?30:R.cardio.work, sets:rounds}); }
    }
    return {name, time:tLabel, type:"strength", items, warm: T<=10 ? WARM3 : WARM};
  }
  function cardioDay(variant){
    const st = variant===1 ? [S_.ham,S_.calf,S_.chest] : [S_.catcow,S_.fig4,S_.quad];
    const strs = (T<=15 ? st.slice(0,2) : st).map(x=>({...x,gen:true}));
    if(machines.length){
      const k = machines[(variant-1)%machines.length];
      const mins = Math.min(T-3, Math.max(8, Math.round(T*0.7/5)*5) + (e.goal==="fat"&&T>=20?5:0));
      const its=[machineItem(k, mins)];
      if(T>15) its.push({...S_.calfraise, gen:true});
      return {name:"유산소 ("+MACH[k].name.replace(/ \(.*\)/,"")+")", time:tLabel, type:"cardio", items:[...its,...strs]};
    }
    const ms=cardioMoves(), plus=(e.goal==="fat"?1:0)+Math.round((T-25)/8)+R.cardio.plus;
    const order = variant%2===1 ? ms : [ms[1],ms[2]||ms[0],ms[0]];
    const mv=order.filter(Boolean).slice(0,3), roundsMv=mv.filter(m=>m.round);
    const target=(T - (T<=15?2:4) - (T>15?2:0))*60*(e.goal==="fat"?1:0.9);
    const per=roundsMv.length ? Math.round(target/((R.cardio.work)+30)/roundsMv.length) : 0;
    const its=mv.map((m,i)=> m.round ? {...m, gen:true, work:m.id==="rope"?30:R.cardio.work, sets:Math.min(12,Math.max(2, per + (i===0?1:0)))} : {...m, gen:true});
    if(!its.some(x=>x.id==="calfraise") && T>15) its.push({...S_.calfraise, gen:true});
    return {name:"유산소 서킷", time:tLabel, type:"cardio", items:[...its,...strs]};
  }
  const recItems=[S_.catcow,S_.ham,S_.fig4,S_.quad,S_.chest]; if(has("foam")) recItems.unshift(LIB.foamquad, LIB.foamback);
  const recover = {name:"회복 스트레칭", time:has("foam")?"약 15분 · 선택":"약 10분 · 선택", type:"recover", items:recItems.map(x=>({...x,gen:true}))};
  const rest = {name:"휴식", time:"-", type:"rest", items:[]};
  const P={0:rest,1:rest,2:rest,3:rest,4:rest,5:rest,6:rest};
  const FA=["squat","push","pull","core","lateral","bi"], FB=["hinge","shoulder","glute","pull2","tri","core"], FC=["squat2","push2","bi","tri","pull","glute"];
  const UA=["push","pull","bi","tri","push2","pull2"], LO=["squat","hinge","glute","core","squat2","calf"], UB=["shoulder","lateral","squat2","pull2","push2","core"], LB=["squat2","hinge","glute","push2","pull","core"];
  const alloc = ratio==="weight" ? "w" : ratio==="cardio" ? "c" : "h";
  if(e.days===1){
    P[3]=strengthDay("전신",FA); P[6]=recover;
  } else if(e.days===2){
    P[1]=strengthDay("전신 A",FA); P[4]=strengthDay("전신 B",FB); P[6]=recover;
  } else if(e.days>=6){
    if(alloc==="w"){ P[1]=strengthDay("상체 A",UA); P[2]=strengthDay("하체 + 코어",LO); P[3]=cardioDay(1); P[4]=strengthDay("상체 B",UB); P[5]=strengthDay("하체 B + 전신",LB); P[6]=strengthDay("전신",FA); }
    else if(alloc==="c"){ P[1]=strengthDay("전신 A",FA); P[2]=cardioDay(1); P[3]=cardioDay(2); P[4]=strengthDay("전신 B",FB); P[5]=cardioDay(3); P[6]=cardioDay(4); }
    else { P[1]=strengthDay("상체 A",UA); P[2]=cardioDay(1); P[3]=strengthDay("하체 + 코어",LO); P[4]=cardioDay(2); P[5]=strengthDay("상체 B + 전신",UB); P[6]=cardioDay(3); }
    if(e.days===7) P[0]=recover;
  } else if(e.days===3){
    if(alloc==="c"){ P[1]=strengthDay("전신 A",FA); P[3]=cardioDay(1); P[5]=strengthDay("전신 B",FB); }
    else { P[1]=strengthDay("전신 A",FA); P[3]=strengthDay("전신 B",FB); P[5]=strengthDay("전신 C",FC); }
    P[6]=recover;
  } else if(e.days===4){
    if(alloc==="w"){ P[1]=strengthDay("전신 A",FA); P[2]=cardioDay(1); P[3]=strengthDay("전신 B",FB); P[5]=strengthDay("전신 C",FC); }
    else { P[1]=strengthDay("전신 A",FA); P[2]=cardioDay(1); P[4]=strengthDay("전신 B",FB); P[5]=cardioDay(2); }
    P[6]=recover;
  } else {
    if(alloc==="w"){ P[1]=strengthDay("상체 A",UA); P[2]=strengthDay("하체 + 코어",LO); P[3]=cardioDay(1); P[4]=strengthDay("상체 B",UB); P[5]=strengthDay("하체 B + 전신",LB); }
    else if(alloc==="c"){ P[1]=strengthDay("전신 A",FA); P[2]=cardioDay(1); P[3]=cardioDay(2); P[4]=strengthDay("전신 B",FB); P[5]=cardioDay(3); }
    else { P[1]=strengthDay("상체 A",UA); P[2]=cardioDay(1); P[3]=strengthDay("하체 + 코어",LO); P[4]=cardioDay(2); P[5]=strengthDay("상체 B + 전신",UB); }
    P[6]=recover;
  }
  // 실제로 걸리는 시간을 대략 계산해서 표시 (선택한 시간보다 짧을 수 있음)
  [0,1,2,3,4,5,6].forEach(d=>{ const p=P[d]; if(!p.items.length) return; const m=estMin(p, R); P[d]={...p, time:"약 "+fmtMin(m)}; });
  return P;
}
function ratioOf(P, R){
  let w=0, c=0; const rest=(R&&R.rest)||90;
  [1,2,3,4,5].forEach(d=>P[d].items.forEach(it=>{
    if(it.stretch) return;
    if(it.round) c += it.sets*((it.work||60)+(it.restSec||30));
    else if(it.unit==="완료" && it.work && it.id!=="catcow") c += it.work;
    else if(it.id==="calfraise" || it.unit==="완료") return;
    else w += it.sets*(45+(it.restSec!==undefined?it.restSec:rest));
  }));
  const t=w+c||1; return {w:Math.round(w/t*100), c:Math.round(c/t*100)};
}
function estMin(p, R){
  let sec = p.type==="strength" ? (p.warm||WARM).work : 0;
  const rest = (R&&R.rest)||90;
  p.items.forEach(it=>{
    if(it.round) sec += it.sets*((it.work||60)+(it.restSec||30));
    else if(it.work && (it.unit==="완료" || it.stretch)) sec += it.sets*it.work;
    else if(it.fixedRx) sec += it.sets*((it.work||20)+(it.restSec||60));
    else if(it.unit==="완료") sec += 60;
    else sec += it.sets*(45 + (it.restSec!==undefined?it.restSec:rest));
  });
  return Math.max(5, Math.round(sec/60/5)*5);
}
function fmtMin(m){ return m>=60 ? Math.floor(m/60)+"시간"+(m%60?" "+m%60+"분":"") : m+"분"; }

async function flush(){

/* ---------- 연속 출석 ---------- */
// 운동 날(근력·유산소)을 완료하면 +1, 놓치면 끊김. 휴식·회복 날은 끊기지 않음(회복 스트레칭을 하면 +1).
// 오늘은 아직 안 했어도 끊기지 않음.
function dayKind(d){ const t=PLAN[d.getDay()].type; return t==="rest"?"rest":t==="recover"?"opt":"need"; }
function firstDay(){ const ks=Object.keys(state.checks).sort(); const a=monday(parse(state.start)); return ks.length && parse(ks[0])<a ? parse(ks[0]) : a; }
function streakNow(){
  let n=0, d=today(); const stop=firstDay();
  for(let i=0;i<730 && d>=stop;i++, d=addDays(d,-1)){
    const k=dayKind(d), ok=dayStatus(d)==="ok", isT=d.getTime()===today().getTime();
    if(ok){ n++; continue; }
    if(k==="need" && !isT) break;
  }
  return n;
}
function streakBest(){
  let best=0, cur=0, d=firstDay(); const t=today();
  for(let i=0;i<730 && d<=t;i++, d=addDays(d,1)){
    const k=dayKind(d), ok=dayStatus(d)==="ok";
    if(ok){ cur++; best=Math.max(best,cur); }
    else if(k==="need" && d.getTime()!==t.getTime()) cur=0;
  }
  return best;
}
function streakBanner(){
  const n=streakNow(), best=streakBest(), t=today(), k=dayKind(t), doneT=dayStatus(t)==="ok";
  let msg;
  if(doneT) msg = n>=2 ? `오늘까지 <b>${n}일 연속</b> 출석!` : "오늘 출석 완료! 내일도 이어가요.";
  else if(k==="need") msg = n>0 ? `오늘도 하면 <b>${n+1}일 연속</b>이에요.` : "오늘 운동하면 연속 출석 시작!";
  else msg = n>0 ? `<b>${n}일 연속</b> 출석 중 · 오늘은 ${k==="rest"?"쉬는 날이라 끊기지 않아요":"회복 스트레칭을 하면 +1"}` : "쉬는 날이에요. 다음 운동 날에 연속 출석을 시작해요.";
  return `<div class="streak ${n>0||doneT?"on":""}"><span class="fire">🔥</span><div><div class="sn">${n}<small>일 연속</small></div><div class="sm">${msg}</div></div><div class="sb">최고<br><b>${best}일</b></div></div>`;
}

let audio=null;
function beep(){ try{ if(!audio) return; const t=audio.currentTime; [0,0.25,0.5].forEach(o=>{ const g=audio.createGain(), os=audio.createOscillator(); os.frequency.value=880; os.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.3,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18); os.start(t+o); os.stop(t+o+0.2); }); }catch(e){} try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
function unlockAudio(){ try{ if(!audio){ const A=window.AudioContext||window.webkitAudioContext; if(A) audio=new A(); } if(audio && audio.state==="suspended") audio.resume(); }catch(e){} }
const T={end:0,total:0,iv:null,label:"",sub:""};
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+pad(s%60); }
function startTimer(sec,label,sub){
  keepAwake(true);
  unlockAudio(); T.total=sec; T.end=Date.now()+sec*1000; T.label=label; T.sub=sub;
  $("#timer").classList.add("show"); $("#timer").classList.remove("end");
  $("#tl").innerHTML=`<b>${esc(label)}</b>${esc(sub)}`;
  clearInterval(T.iv); tick(); T.iv=setInterval(tick,250);
}
function tick(){
  const left=(T.end-Date.now())/1000;
  $("#tt").textContent=fmt(left);
  $("#tbar").style.width=Math.max(0,Math.min(100,100-(left/T.total)*100))+"%";
  if(left<=0){ clearInterval(T.iv); $("#timer").classList.add("end"); $("#tt").textContent="0:00"; $("#tl").innerHTML=`<b>시간 끝!</b>${esc(T.label.startsWith("휴식")?"다음 세트 시작":"완료 체크 잊지 마세요")}`; beep(); }
}
$("#tplus").onclick=()=>{ unlockAudio(); if(Date.now()>T.end){ T.end=Date.now()+30000; T.total=30; $("#timer").classList.remove("end"); $("#tl").innerHTML=`<b>${esc(T.label)}</b>${esc(T.sub)}`; clearInterval(T.iv); T.iv=setInterval(tick,250);} else { T.end+=30000; T.total+=30; } tick(); };

function recommend(st){

    E("rdl","주의","덤벨 1개를 두 손으로 잡고 가볍게. 허리가 당기면 깊이를 줄이세요.");

    E("birddog","바꿔서","처음엔 팔 하나 또는 다리 하나만 뻗기부터.");
    E("kneeup","바꿔서","무릎을 높이 들지 말고 발을 살짝만 들기. 의자 등받이를 잡아도 OK.");
    E("shadowbox","추천","관절 충격 없이 숨이 차는 좋은 유산소예요.");
    E("bridge","추천","관절 부담이 적어 꼭 챙기면 좋은 운동이에요.");
    E("legpress","주의","무릎 90도보다 얕게, 가벼운 무게로. 무릎이 아프면 그날은 빼세요.");

function baseRx(it){
  if(it.round){ const w=it.work>=60?(it.work/60)+"분":it.work+"초"; return w+" × "+it.sets+"라운드 · 쉬기 "+it.restSec+"초"; }
  return it.rx;
}
function recFor(it){ // 적용된 추천으로 운동 처방 바꾸기
  if(it.gen) return {...it, rx: it.round ? baseRx(it) : (it.rx||baseRx(it))};
  if(!state.applyRec || !state.profile || it.id==="warm" || it.stretch || it.unit==="완료"){ return {...it, rx:baseRx(it)}; }
  const r=recommend(state);
  if(it.round){ const x={...it, work:r.cardio.work, sets:Math.max(1,it.sets+r.cardio.plus)}; return {...x, rx:baseRx(x)}; }
  if(it.id==="calfraise") return {...it, rx:baseRx(it)};
  const wk = weekNum(today()), sets = wk>=4 ? r.sets4 : r.sets;
  const lr = /좌우/.test(it.rx) ? "좌우 " : "";
  return {...it, sets, rx: lr+r.reps+" × "+sets+"세트"};
}

    state.env=JSON.parse(JSON.stringify(ob.env));
    if(a==="apply"){ state.manualOn=false; state.plan={body:ob.body, profile:{...ob.p}, env:JSON.parse(JSON.stringify(ob.env))}; state.applyRec=true; state.rest=recommend(state).rest; }

          <div class="er3">${body}</div></div>`;
      }).join("");
      h += edPick===d ? `<div class="eqpanel"><input type="search" id="edQ" placeholder="운동 이름 검색 (예: 스쿼트, 로우, 자전거)" autocomplete="off" value="${esc(edQ)}"><div id="edList">${edListHTML(edQ)}</div><button class="later" data-edclose="1" style="margin-top:6px">닫기</button></div>`
                      : `<button class="edadd" data-edadd="${d}">＋ 운동 추가</button>`;
    }
    h += `</div>`;
  });
  h += `<div class="err" id="edErr"></div>
    <div class="edsave"><button class="btn" data-ed="save">저장하고 이 계획 쓰기</button><button class="btn ghost" data-ed="cancel">취소</button></div>`;
  return h;
}
function edListHTML(q){
  const L=exLib(), nq=norm(q);
  const list=Object.values(L).filter(x=>x.id!=="warm" && (!nq || norm(x.name).includes(nq)));
  list.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  let h=list.slice(0,60).map(x=>`<button class="eqrow" data-edpick="${x.id}"><b>＋ ${esc(x.name)}</b><span>${esc((x.cue&&x.cue[0])||"")}</span></button>`).join("");
  if(q && q.trim()) h += `<button class="eqrow custom" data-edpickc="${esc(q.trim())}"><b>＋ ‘${esc(q.trim())}’ 직접 추가</b><span>목록에 없는 운동도 이름만으로 넣을 수 있어요. 자세 설명은 없어요.</span></button>`;
  return h || `<div class="hint">검색어를 입력하거나 직접 추가하세요.</div>`;
}
function edValidate(){
  for(const d of ORDER){ const day=ED[d]; if(day.type==="rest") continue;
    for(const x of day.items||[]){
      if(!String(x.name||"").trim()) return `${DAYN[d]}요일에 이름이 빈 운동이 있어요.`;
      if(x.mode!=="reps" && !(+x.secs>=5 && +x.secs<=7200)) return `${DAYN[d]}요일 ‘${x.name}’의 시간을 5초~2시간 사이로 넣어주세요.`;
      if(!(+x.rest>=0 && +x.rest<=600)) return `${DAYN[d]}요일 ‘${x.name}’의 휴식을 0~600초 사이로 넣어주세요.`;
    }
    if((day.type==="strength"||day.type==="cardio") && !(day.items||[]).length) return `${DAYN[d]}요일이 ${TYPE_OPT[day.type]} 날인데 운동이 없어요. 운동을 추가하거나 휴식으로 바꿔주세요.`;
  }
  return "";
}
document.addEventListener("input",ev=>{
  if(tab!=="edit" || !ED) return;
  const t=ev.target, ds=t.dataset;
  if(ds.edname!==undefined){ ED[+ds.edname].name=t.value; }
  else if(ds.edf){ const [d,i,f]=ds.edf.split(":"); const x=ED[+d].items[+i]; x[f] = (f==="secs"||f==="rest") ? (t.value===""?"":+t.value) : t.value; }
  else if(t.id==="edQ"){ edQ=t.value; const l=$("#edList"); if(l) l.innerHTML=edListHTML(edQ); }
});
document.addEventListener("click",e=>{
  if(tab!=="edit") return;
  const b=e.target.closest("button"); if(!b) return;
  const ds=b.dataset, y=window.scrollY, re=()=>{ render(); window.scrollTo(0,y); };
  if(ds.edtype){ const [d,k]=ds.edtype.split(":"); ED[+d].type=k; if(!ED[+d].name || Object.values(TYPE_OPT).includes(ED[+d].name)) ED[+d].name=k==="rest"?"휴식":TYPE_OPT[k]; re(); }
  else if(ds.edwarm){ const d=+ds.edwarm; ED[d].warm = ED[d].warm===false; re(); }
  else if(ds.edstep){ const [d,i,f,dv]=ds.edstep.split(":"); const x=ED[+d].items[+i]; x[f]=Math.max(1,Math.min(20,(+x[f]||1)+(+dv))); re(); }
  else if(ds.edmode){ const [d,i,m]=ds.edmode.split(":"); const x=ED[+d].items[+i]; x.mode=m; if(m==="reps"&&!x.reps) x.reps="10회"; if(m!=="reps"&&!x.secs) x.secs=m==="rounds"?60:30; if(x.rest===""||x.rest==null) x.rest=m==="rounds"?30:m==="time"?0:90; re(); }
  else if(ds.edmv){ const [d,i,dv]=ds.edmv.split(":").map(Number); const arr=ED[d].items, j=i+dv; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; re(); }
  else if(ds.eddel){ const [d,i]=ds.eddel.split(":").map(Number); ED[d].items.splice(i,1); re(); }
  else if(ds.edadd!==undefined){ edPick=+ds.edadd; edQ=""; re(); const q=$("#edQ"); if(q) q.focus(); }
  else if(ds.edclose){ edPick=null; re(); }
  else if(ds.edpick){ const x=exLib()[ds.edpick]; ED[edPick].items.push(defaultEntry(x)); edQ=""; re(); }
  else if(ds.edpickc){ ED[edPick].items.push({uid:uid(), ref:null, name:ds.edpickc, mode:"reps", sets:2, reps:"10회", rest:90}); edQ=""; re(); }
  else if(ds.ed==="load"){ ED=fromPlan(state.manualOn ? (state.plan?buildPlan({...state, ...state.plan}):DEFAULT_PLAN) : PLAN); edPick=null; re(); }
  else if(ds.ed==="clear"){ ORDER.forEach(d=>{ ED[d]={name:"휴식",type:"rest",items:[],warm:true}; }); edPick=null; re(); }
  else if(ds.ed==="cancel"){ ED=null; goTab("week"); }
  else if(ds.ed==="save"){ const err=edValidate(); if(err){ $("#edErr").textContent=err; $("#edErr").scrollIntoView({block:"center"}); return; }
    state.manual=clone(ED); state.manualOn=true; save(); ED=null; goTab("week"); }
});

/* ---------- 앱 기능 (설치·오프라인·화면 켜짐·기록 보호) ---------- */
const isStandalone = () => { try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let installEvt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; render(); });
window.addEventListener("appinstalled", ()=>{ installEvt=null; render(); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
// 브라우저가 저장 공간이 부족할 때 기록을 지우지 않도록 요청
let persisted = null;
(async()=>{ try{ if(navigator.storage && navigator.storage.persist){ persisted = await navigator.storage.persisted() || await navigator.storage.persist(); } }catch(e){} })();
// 타이머가 도는 동안 화면이 꺼지지 않게
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock=null; }); } }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && $("#timer").classList.contains("show")) keepAwake(true); });
function installBanner(){
  if(isStandalone()) return "";
  try{ if(localStorage.getItem("homefit-install-hide")==="1") return ""; }catch(e){}
  if(!installEvt && !isIOS) return "";
  return `<div class="installbar"><img src="icon-192.png" alt=""><div><b>앱으로 설치하기</b><span>홈 화면 아이콘으로 바로 열고, 인터넷 없이도 쓸 수 있어요.</span></div><button class="btn sm" data-install="1">설치</button><button class="x" data-installhide="1" aria-label="닫기">×</button></div>`;
}
function installGuide(){
  if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); return; }
  $("#mtext").innerHTML = isIOS
    ? "<b>아이폰에 설치하기</b><br>1. 사파리 아래쪽 <b>공유 버튼(□↑)</b>을 누르세요.<br>2. <b>홈 화면에 추가</b>를 누르세요.<br>3. 오른쪽 위 <b>추가</b>를 누르면 끝!<br><small>사파리에서만 돼요. 카카오톡 안에서 열었다면 사파리로 다시 열어주세요.</small>"
    : "<b>설치하기</b><br>크롬 오른쪽 위 <b>⋮ 메뉴</b> → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.";
  $("#modal").classList.add("show"); $("#mno").style.display="none"; $("#myes").textContent="알겠어요";
  $("#myes").onclick=()=>{ $("#modal").classList.remove("show"); $("#mno").style.display=""; $("#myes").textContent="확인"; };
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-install],[data-installhide]"); if(!b) return;
  if(b.dataset.install) installGuide();
  else { try{ localStorage.setItem("homefit-install-hide","1"); }catch(err){} render(); }
});

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const y=e.target.closest(".yt[data-play]");
  if(y){ const id=y.dataset.play; y.removeAttribute("data-play"); y.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="운동 영상"></iframe>`; return; }
  const ta=e.target.closest("a[data-tab]"); if(ta){ e.preventDefault(); goTab(ta.dataset.tab); return; }
  const gt=e.target.closest("[data-gotab]"); if(gt){ goTab(gt.dataset.gotab); return; }
  const mo=e.target.closest("[data-manoff],[data-manon]"); if(mo){ state.manualOn = !!mo.dataset.manon; save(); render(); return; }
  const b=e.target.closest("button,tr[data-go]"); if(!b) return;
  if(b.dataset.vsave){ const inp=document.querySelector(`[data-vin="${b.dataset.vsave}"]`); const id=ytId(inp&&inp.value); if(!id){ inp.value=""; inp.placeholder="유튜브 주소가 아니에요. 다시 붙여넣어 주세요."; inp.focus(); return; } state.videos[b.dataset.vsave]=id; save(); render(); return; }
  if(b.dataset.vdel){ delete state.videos[b.dataset.vdel]; save(); render(); return; }
  if(b.dataset.rebody){ e.preventDefault(); openOnboard(+b.dataset.rebody); return; }
  if(b.id==="recToggle"){ state.applyRec=!state.applyRec; save(); render(); return; }
  if(b.dataset.dow!==undefined){ selDow=+b.dataset.dow; render(); return; }
  if(b.dataset.go!==undefined){ selDow=+b.dataset.go; goTab("today"); return; }
  if(b.dataset.rest){ state.rest=+b.dataset.rest; save(); render(); return; }
  if(b.dataset.cond){ const dk=b.dataset.dk; state.cond[dk] = state.cond[dk]===b.dataset.cond?undefined:b.dataset.cond; if(!state.cond[dk]) delete state.cond[dk]; save(); render(); return; }
  if(b.dataset.run){ startTimer(+b.dataset.run, b.dataset.name, "끝나면 체크하기"); return; }
  if(b.dataset.set){
    const dk=key(selDate()); const c=state.checks[dk]=state.checks[dk]||{}; const k=b.dataset.set;
    if(c[k]) delete c[k]; else {
      c[k]=true;
      const [id,s]=k.split("#"); const it=itemsFor(selDow).find(x=>x.id===id);
      const rest = it ? (it.restSec!==undefined ? it.restSec : state.rest) : 0;
      if(it && rest>0){
        const allDone = dayProgress(selDate()).dn===dayProgress(selDate()).tot;
        if(!allDone) startTimer(rest, "휴식 "+fmt(rest), b.dataset.last==="1"?"다음 운동 준비":"다음 "+(it.unit||"세트")+" 준비");
      }
    }
    if(!Object.keys(c).length) delete state.checks[dk];
    save(); render(); return;
  }
  if(b.id==="firstBtn"){ ask("체형·정보·장비·루틴·직접 짠 계획·운동 기록·영상까지 모두 지우고, 사이트에 처음 들어온 상태로 돌아갈까요? 되돌릴 수 없어요.",()=>{ resetAll(); }); return; }
  if(b.id==="resetBtn"){ ask("모든 체크와 컨디션 기록을 지울까요? 되돌릴 수 없어요.",()=>{ state.checks={}; state.cond={}; save(); render(); }); return; }
});
document.addEventListener("change",e=>{
  if(e.target.id==="startIn" && e.target.value){ state.start=e.target.value; save(); render(); }
});
function goTab(t){
  if(t==="edit" && tab!=="edit"){ ED=null; }
  if(t==="me" && tab!=="me"){ me=null; meResult=null; meEqOpen=false; meEqQ=""; }
  tab=t; try{ if(location.hash!=="#"+t) history.replaceState(null,"","#"+t); }catch(err){}
  render(); window.scrollTo(0,0);
}
function route(){ const h=(location.hash||"").slice(1); tab=["today","week","log","me","edit"].includes(h)?h:"today"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);

/* ---------- 시작 ---------- */
const local=loadLocal(); if(local) state=local;
route();
if(!state.onboarded) openOnboard();
// 자정이 지나면 오늘 날짜 갱신
let lastDay=key(today()); setInterval(()=>{ if(key(today())!==lastDay){ lastDay=key(today()); selDow=today().getDay(); render(); } },60000);
</script>
